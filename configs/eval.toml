# Evaluation protocol v2 (method-independent; tkh/evalkit, scripts/evaluate.py). Pre-registered by git commit
# before the run it governs. FAST=1 uses the [fast] overrides.

[eval]
hub_frac = 0.2                               # evaluator's fixed hub share (data contract), for M1 strata and M4 baselines
jobs = 8                                     # parallel method re-runs
cache_dir = "../out/eval_cache"              # frozen null / perturbed exports and the builds made from them
primary_snapshot = 2026
primary_level = 1
# The one hook through which the evaluator re-runs a method (null and perturbed graphs). {extra} carries per-run
# method arguments (e.g. hyperparameters of a variant).
build_cmd = "{python} scripts/build.py --graph {graph} --out {out} --placeholder-labels --selection out/selection.json {extra}"

[m1]                                         # coherence: residual citation coupling (independent ruler)
primary_stratum = "no_overlap"               # pairs sharing no non-hub concept: shared structure cannot explain coupling
split_seed = 0                               # committed cited-work split data/eval_splits.json; half A = dev, half B = report
random_labels_R = 999

[m2]                                         # stability
frac = 0.10                                  # the brief: remove 10% of hyper-edges (all relations), per period
seeds = [0, 1, 2, 3, 4]
sensitivity_relations = "concept"            # extra row: remove 10% of the method-centred concept relations only

[m3]                                         # label faithfulness: claim-level entailment, one judge family ([labels] judge_model)
enabled = false                              # deferred: the LLM judge is off in method-iteration runs (deterministic checks still run)
snapshots = [2026]
levels = [0, 1]
j_min = 0.4                                  # validity gate on the hard (sibling) controls

[m4]                                         # extrinsic retrieval: known-item queries from claim sentences, target names masked
snapshot = 2026
draws = 20                                   # random tie-breaks averaged for the drill-down
null_draws = 5
budgets = [50, 200]

[nulls]                                      # M5: type- and period-preserving hypergraph configuration model (frozen exports)
R = 99
R_m4 = 19                                    # null hierarchies also scored on M4 (each costs one full retrieval run)
sweeps = 10

[mde]
fractions = [0.05, 0.1, 0.2, 0.4]            # share of concept nodes whose whole ancestor path is swapped
seeds = [0, 1, 2]

[selection]                                  # SHAC-T alpha selection (scripts/sweep.py): one-SE rule on M1, dev half A
alpha_grid = [0.0, 0.25, 0.5, 0.75, 1.0]
tie_toward = 0.5
max_giant_share = 0.5

[ablations]                                  # each changes ONE parameter of the selected configuration
gamma0 = { gamma = 0.0 }
rho_inf = { rho = "inf" }
freeze = { freeze = true }

[fast]
R = 9
R_m4 = 3
random_labels_R = 99
seeds = [0, 1]
mde_seeds = [0]
