# Default run configuration. Relative paths are resolved against this file's directory.
# To use other inputs, copy this file and point TKH_CONFIG at it (or pass --config to a script).

[inputs]
graph = "../data/tkh_collection10.json"          # required: TKH export (meta, nodes, hyperedges)
articles = "../data/collection10_articles.csv"   # optional: id, year[, title, arxiv_id]; else derived from the graph
questions = "../data/questions.csv"              # optional: T6 extrinsic-task queries
ground_truth = "../data/ground_truth.json"       # optional: T6 targets and faithfulness references

[snapshots]
cutoffs = [2020, 2022, 2024, 2026]               # cumulative snapshots: content published <= each year

[hierarchy]
budgets = [15, 60, 240]                          # P2 hard limits: max super-nodes at level 0, 1, 2 (N_0 ~ 10-15)

[method]                                         # SHAC-T parameters (tkh/hierarchy.py Params); pre-registered defaults
alpha = 0.5                                      # weight of the semantic score (CDF-rank scale); 0 = structure only, 1 = semantics only
gamma = 0.5                                      # temporal coupling: weight of previous-snapshot co-membership (0 = independent snapshots)
rho = 2.0                                        # size cap: a level-k super-node holds <= rho * n / N_k concept nodes ("inf" = no cap)
structure = "native"                             # "native" (hypergraph lambda-1 gain on the collapsed hypergraph) or "projection" (clique average linkage)
lsa_dim = 100                                    # semantic LSA dimensions (char 3-5-gram TF-IDF of names + aliases, fitted per snapshot)
hub_frac = 0.2                                   # nodes in more than this share of a snapshot's papers carry no structural signal

[labels]                                         # T5 labels (tkh/label.py) and T6 E3 judge (tkh/evaluate/faithfulness.py), via a local Ollama server
labeller_model = "qwen2.5:7b-instruct"           # open model that writes labels and glosses (levels 0-1)
judge_model = "llama3.1:8b"                      # judge from a different open model family
endpoint = "http://localhost:11434"
labeller_prompt = "prompts/labeller.txt"         # prompt templates ({placeholders} filled from the evidence)
judge_prompt = "prompts/judge.txt"
cache = "../data/llm_cache.json"                 # committed response cache: offline runs replay it
mode = "offline"                                 # offline | live | refresh (env TKH_LLM_MODE overrides)
seed = 0                                         # member split into labeller half / held-out judge half
max_members = 40                                 # members shown per prompt (highest degree first)
max_claims = 12                                  # claim sentences in the judge's evidence

[outputs]
out_dir = "../out"
figures_dir = "../figures"
