# Default run configuration. Relative paths are resolved against this file's directory.
# To use other inputs, copy this file and point TKH_CONFIG at it (or pass --config to a script).

[inputs]
graph = "../data/tkh_collection10.json"          # required: TKH export (meta, nodes, hyperedges)
articles = "../data/collection10_articles.csv"   # optional: id, year[, title, arxiv_id]; else derived from the graph

[snapshots]
cutoffs = [2020, 2022, 2024, 2026]               # cumulative snapshots: content published <= each year

[hierarchy]
budgets = [15, 60, 240]                          # P2 hard limits: max super-nodes at level 0, 1, 2 (N_0 ~ 10-15)

[method]                                         # SHAC parameters (tkh/hierarchy.py Params; unknown keys are an error)
alpha = 0.5                                      # weight of the semantic rank; 0 = structure only, 1 = semantics only
gamma = 0.5                                      # weight of the localised temporal prior; 0 = independent snapshots
rho = 2.0                                        # size cap: a level-k super-node holds <= rho * n / N_k concept nodes (>= 2, or "inf")
edge_weight = "relation_balanced"                # "inverse_size" (1/(|e|-1)) or "relation_balanced" (equal total weight per relation)
hub_frac = 0.2                                   # hubs: concept nodes in more than this share of the snapshot's papers (1.0 = no hubs)
lsa_dim = 100                                    # LSA dimensions of the char 3-5-gram TF-IDF of names + aliases, fitted per snapshot

[outputs]
out_dir = "../out"
figures_dir = "../figures"
